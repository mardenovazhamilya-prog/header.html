<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Header</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
    body {
    font-family: Verdana, sans-serif;
}

header {
    width: 100%;
    background-color: #81E1F0;
    padding: 20px;
}

.container {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
}

.logo {
    font-size: 28px;
    font-weight: bold;
    color: white;
}

nav ul {
    display: flex;
    list-style: none;
    gap: 20px;
}

nav a {
    text-decoration: none;
    color: #F081D2;
    font-size: 18px;
    padding: 8px 12px;
    border-radius: 5px;
}

nav a:hover {
    background-color: white;
    color: #81DCF0;
}

.active {
    background-color: #F3F096;
    color: black;
}

@media (max-width: 768px) {

.container {
    flex-direction: column;
    align-items: flex-start;
}

nav {
    margin-top: 15px;
    width: 100%;
}

nav ul {
    flex-wrap: wrap;
    gap: 10px;
}

}
</style>

</head>

<body>

<header>
<div class="container">

<div class="logo">
My Intertaiment Company 
</div>

<nav>
<ul>
<li><a href="#" class="active">Glycine Global Intertaiment</a></li>
<li><a href="#">About Us </a></li>
<li><a href="#">Services</a></li>
<li><a href="#">Contact</a></li>
<li><a href="#">Blog</a></li>
</ul>
</nav>

</div>
</header>

</body>
</html>
